name: Build & Protect APK (DPT-Shell)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Add Swap Space (Prevent Memory Crash)
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Make build.sh executable
        run: chmod +x build.sh

      # 1. Original APK Build karein
      - name: Build Original APK
        run: bash build.sh

      # 2. DPT-Shell download karein aur APK ko protect karein
      - name: Apply DPT-Shell Protection
        run: |
          echo "Downloading DPT-Shell..."
          DPT_JAR_URL=$(curl -s https://api.github.com/repos/luoyesiqiu/dpt-shell/releases/latest | grep "browser_download_url.*dpt.jar" | cut -d '"' -f 4)
          curl -L -o dpt.jar "$DPT_JAR_URL"
          
          echo "Applying DPT-Shell to app-debug.apk..."
          # Aapki keystore file ka path aur password yahan pass kiya gaya hai
          # taaki HWID change na ho
          java -jar dpt.jar -f app/build/outputs/apk/debug/app-debug.apk -o app-protected.apk -k my-release-key.jks -p password123 -a my-alias -kp password123

      # 3. Protected APK ko upload karein
      - name: Upload Protected APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gucci-loader-protected
          path: app-protected.apk
          if-no-files-found: error
