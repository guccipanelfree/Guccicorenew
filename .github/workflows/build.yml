name: Build & Protect APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🚀 NDK Setup (XopProtector ko NDK chahiye hota hai)
      - name: Setup Android NDK
        run: |
          # GitHub runner par pehle se installed NDK ka latest version uthayega
          NDK_VERSION=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n 1 | xargs basename)
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
          echo "Using NDK: $ANDROID_NDK_HOME"

      - name: Add Swap Space (Prevent Memory Crash)
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Make build.sh executable
        run: chmod +x build.sh

      - name: Build & Protect APK
        run: bash build.sh

      # 👇 PROTECTED APK UPLOAD HOGA 👇
      - name: Upload Protected APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gucci-loader-protected
          path: app-protected.apk
          if-no-files-found: error
