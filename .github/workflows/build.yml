name: Build Android App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    - uses: android-actions/setup-android@v3
    - name: Build
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        export PATH="$PWD/gradle-8.2/bin:$PATH"
        rm -rf app *.gradle *.properties
        mkdir -p app/src/main/java/com/example/shtile app/src/main/res/drawable app/src/main/res/layout app/src/main/res/values app/src/main/assets
        wget -q "https://cdn.phototourl.com/member/2026-11-02-d4837e53-b8a5-4997-9673-cbf6a3594ec1.png" -O app/src/main/res/drawable/ic_app_icon.png
        cp Gucci_core app/src/main/assets/ 2>/dev/null||true
        cp Gucci_brutal app/src/main/assets/ 2>/dev/null||true
        printf 'pluginManagement{repositories{google();mavenCentral()}}\ndependencyResolutionManagement{repositories{google();mavenCentral()}}\nrootProject.name="Settings"\ninclude ":app"' > settings.gradle
        printf 'plugins{id "com.android.application" version "8.2.2" apply false;id "org.jetbrains.kotlin.android" version "1.9.22" apply false}' > build.gradle
        printf 'android.useAndroidX=true\nandroid.nonTransitiveRClass=true\norg.gradle.jvmargs=-Xmx2048m' > gradle.properties
        printf 'plugins{id "com.android.application";id "org.jetbrains.kotlin.android"}\nandroid{namespace "com.example.shtile"\ncompileSdk 34\ndefaultConfig{applicationId "com.example.shtile";minSdk 24;targetSdk 34;versionCode 65;versionName "65.0"}\ncompileOptions{sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17}\nkotlinOptions{jvmTarget="17"}}\ndependencies{implementation "androidx.appcompat:appcompat:1.6.1";implementation "androidx.core:core-ktx:1.12.0";implementation "com.google.android.material:material:1.11.0"}' > app/build.gradle
        printf '<resources><color name="bg_main">#0B0F14</color><color name="accent_green">#00E5A0</color><color name="text_primary">#FFFFFF</color><color name="text_secondary">#9BA3AF</color></resources>' > app/src/main/res/values/colors.xml
        printf '<resources><string name="app_name">Settings</string></resources>' > app/src/main/res/values/strings.xml
        printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>\n<application android:label="Settings" android:icon="@drawable/ic_app_icon" android:theme="@style/Theme.MaterialComponents.NoActionBar">\n<activity android:name=".MainActivity" android:exported="true"/>\n<activity-alias android:name=".MainActivityAlias" android:targetActivity=".MainActivity" android:exported="true" android:enabled="true" android:icon="@drawable/ic_app_icon"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity-alias>\n<service android:name=".RunnerService" android:exported="false" android:foregroundServiceType="dataSync"/>\n<service android:name=".SafeTileService" android:exported="true" android:icon="@drawable/ic_tile_normal" android:label="Boost" android:permission="android.permission.BIND_QUICK_SETTINGS_TILE"><intent-filter><action android:name="android.service.quicksettings.action.QS_TILE"/></intent-filter></service>\n<service android:name=".BrutalTileService" android:exported="true" android:icon="@drawable/ic_tile_brutal" android:label="Turbo Mode" android:permission="android.permission.BIND_QUICK_SETTINGS_TILE"><intent-filter><action android:name="android.service.quicksettings.action.QS_TILE"/></intent-filter></service>\n<service android:name=".FocusTileService" android:exported="true" android:icon="@drawable/ic_tile_focus" android:label="Focus Mode" android:permission="android.permission.BIND_QUICK_SETTINGS_TILE"><intent-filter><action android:name="android.service.quicksettings.action.QS_TILE"/></intent-filter></service>\n</application>\n</manifest>' > app/src/main/AndroidManifest.xml
        printf '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:background="@drawable/bg_dialog" android:padding="24dp" android:gravity="center">\n<TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="ROOT REQUIRED" android:textColor="#FFFFFF" android:textSize="20sp" android:textStyle="bold" android:layout_marginBottom="16dp"/>\n<TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="INX-LOADER Requires Root Permission&#10;Please Grant Root Permission To Continue" android:textColor="#9BA3AF" android:textSize="14sp" android:gravity="center" android:layout_marginBottom="24dp"/>\n<Button android:id="@+id/btnGrant" android:layout_width="match_parent" android:layout_height="48dp" android:text="GRANT" android:textColor="#000000" android:textStyle="bold" android:background="@drawable/bg_btn_grant" android:layout_marginBottom="12dp"/>\n<Button android:id="@+id/btnExit" android:layout_width="match_parent" android:layout_height="48dp" android:text="EXIT" android:textColor="#FF4D4D" android:textStyle="bold" android:background="@drawable/bg_btn_exit"/>\n</LinearLayout>' > app/src/main/res/layout/dialog_root.xml
        printf '<?xml version="1.0" encoding="utf-8"?>\n<ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="@color/bg_main" android:fillViewport="true">\n<LinearLayout android:orientation="vertical" android:padding="24dp" android:layout_width="match_parent" android:layout_height="wrap_content">\n<TextView android:id="@+id/titleText" android:text="INX-LOADER PANEL" android:textColor="#FFFFFF" android:textSize="32sp" android:textStyle="bold" android:layout_width="wrap_content" android:layout_height="wrap_content"/>\n<TextView android:id="@+id/subtitleText" android:text="Invisible X Loader Owner- GUCCI" android:textColor="#777777" android:textSize="14sp" android:layout_marginTop="4dp" android:layout_marginBottom="32dp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>\n<LinearLayout android:orientation="vertical" android:padding="20dp" android:background="@drawable/bg_box_dark" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginBottom="16dp">\n<TextView android:text="LICENSE KEY" android:textColor="@color/accent_green" android:textSize="12sp" android:textStyle="bold" android:layout_marginBottom="8dp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>\n<EditText android:id="@+id/keyInput" android:hint="Enter key..." android:inputType="text" android:padding="12dp" android:background="#00000000" android:textColor="@color/text_primary" android:textColorHint="@color/text_secondary" android:layout_width="match_parent" android:layout_height="wrap_content"/>\n</LinearLayout>\n<LinearLayout android:orientation="vertical" android:padding="20dp" android:background="@drawable/bg_box_dark" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginBottom="24dp">\n<TextView android:text="SELECT DRIVER (1-10)" android:textColor="@color/accent_green" android:textSize="12sp" android:textStyle="bold" android:layout_marginBottom="8dp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>\n<EditText android:id="@+id/brutalInput" android:hint="e.g. 7" android:inputType="number" android:padding="12dp" android:background="#00000000" android:textColor="@color/text_primary" android:textColorHint="@color/text_secondary" android:layout_width="match_parent" android:layout_height="wrap_content"/>\n<TextView android:id="@+id/driverNameText" android:textColor="@color/accent_green" android:textSize="14sp" android:textStyle="bold" android:layout_marginTop="4dp" android:paddingStart="12dp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>\n</LinearLayout>\n<Button android:id="@+id/saveKeyBtn" android:layout_width="match_parent" android:layout_height="56dp" android:text="SAVE CONFIGURATION" android:textColor="#000000" android:textSize="14sp" android:textStyle="bold" android:background="@drawable/bg_btn_save" android:layout_marginBottom="16dp"/>\n<Button android:id="@+id/loadFilesBtn" android:layout_width="wrap_content" android:layout_height="44dp" android:layout_marginTop="16dp" android:layout_gravity="center_horizontal" android:paddingStart="48dp" android:paddingEnd="48dp" android:text="LOAD INX" android:textColor="@color/accent_green" android:textSize="13sp" android:textStyle="bold" android:background="@drawable/bg_btn_load"/>\n<TextView android:paddingTop="40dp" android:gravity="center" android:text="Use Quick Setting tiles to load INX-Payload" android:textColor="#555555" android:textSize="12sp" android:layout_width="match_parent" android:layout_height="wrap_content"/>\n<TextView android:id="@+id/contactAdminText" android:paddingTop="16dp" android:gravity="center" android:text="Contact Admin for Help" android:textColor="@color/accent_green" android:textSize="14sp" android:textStyle="bold" android:layout_width="match_parent" android:layout_height="wrap_content"/>\n<View android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" />\n<LinearLayout android:orientation="horizontal" android:layout_width="match_parent" android:layout_height="wrap_content" android:paddingBottom="24dp" android:gravity="space_between">\n<ImageButton android:id="@+id/hideAppsIcon" android:layout_width="60dp" android:layout_height="60dp" android:padding="16dp" android:background="?attr/selectableItemBackgroundBorderless" android:src="@drawable/ic_hide" android:tint="@color/accent_green"/>\n<ImageButton android:id="@+id/homeIcon" android:layout_width="60dp" android:layout_height="60dp" android:padding="16dp" android:background="?attr/selectableItemBackgroundBorderless" android:src="@drawable/ic_home" android:tint="@color/accent_green"/>\n</LinearLayout>\n</LinearLayout>\n</ScrollView>' > app/src/main/res/layout/activity_main.xml
printf '<ripple xmlns:android="http://schemas.android.com/apk/res/android" android:color="#33FFFFFF"><item><shape android:shape="rectangle"><solid android:color="@color/accent_green"/><corners android:radius="12dp"/></shape></item></ripple>' > app/src/main/res/drawable/bg_btn_save.xml
printf '<ripple xmlns:android="http://schemas.android.com/apk/res/android" android:color="#33FFFFFF"><item><shape android:shape="rectangle"><solid android:color="#232A35"/><stroke android:width="1dp" android:color="@color/accent_green"/><corners android:radius="22dp"/></shape></item></ripple>' > app/src/main/res/drawable/bg_btn_load.xml
printf '<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#151B23"/><corners android:radius="12dp"/><stroke android:width="1dp" android:color="#232A35"/></shape>' > app/src/main/res/drawable/bg_box_dark.xml
printf '<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#1A222C"/><corners android:radius="16dp"/></shape>' > app/src/main/res/drawable/bg_dialog.xml
printf '<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#00E5A0"/><corners android:radius="12dp"/></shape>' > app/src/main/res/drawable/bg_btn_grant.xml
printf '<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#00000000"/><stroke android:width="1dp" android:color="#FF4D4D"/><corners android:radius="12dp"/></shape>' > app/src/main/res/drawable/bg_btn_exit.xml
printf '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M12,1.5 C14.5,4.5 16,6.5 16,7 L8,7 C8,6.5 9.5,4.5 12,1.5 Z M7.5,8 L16.5,8 L16.5,15.5 L7.5,15.5 Z M12,9 A1.8,1.8 0 1,0 12,12.6 A1.8,1.8 0 1,0 12,9 Z M7.5,12 C4.5,13 3,15.5 3,19.5 L3,21 L7.5,16.5 Z M16.5,12 C19.5,13 21,15.5 21,19.5 L21,21 L16.5,16.5 Z M8,16 L16,16 L16,18 L8,18 Z M9.5,18.5 C9.5,18.5 10.5,21 12,23.5 C13.5,21 14.5,18.5 14.5,18.5 L13,20.5 L12,19 L11,20.5 Z"/></vector>' > app/src/main/res/drawable/ic_tile_normal.xml
printf '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M7,2v11h3v9l7,-12h-4l4,-8z"/></vector>' > app/src/main/res/drawable/ic_tile_brutal.xml
printf '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M10,20v-6h4v6h5v-8h3L12,3 2,12h3v8z"/></vector>' > app/src/main/res/drawable/ic_home.xml
printf '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M12,7c2.76,0 5,2.24 5,5 0,0.65 -0.13,1.26 -0.36,1.83l2.92,2.92c1.51,-1.26 2.7,-2.89 3.43,-4.75 -1.73,-4.39 -6,-7.5 -11,-7.5 -1.4,0 -2.74,0.25 -3.98,0.7l2.16,2.16C10.74,7.13 11.35,7 12,7zM2,4.27l2.28,2.28 0.46,0.46C3.08,8.3 1.78,10.02 1,12c1.73,4.39 6,7.5 11,7.5 1.55,0 3.03,-0.3 4.38,-0.84l0.42,0.42L19.73,22 21,20.73 3.27,3 2,4.27zM7.53,9.8l1.55,1.55c-0.05,0.21 -0.08,0.43 -0.08,0.65 0,1.66 1.34,3 3,3 0.22,0 0.44,-0.03 0.65,-0.08l1.55,1.55c-0.67,0.33 -1.41,0.53 -2.2,0.53 -2.76,0 -5,-2.24 -5,-5 0,-0.79 0.2,-1.53 0.53,-2.2zM11.84,9.02l3.15,3.15 0.02,-0.16c0,-1.66 -1.34,-3 -3,-3l-0.17,0.01z"/></vector>' > app/src/main/res/drawable/ic_hide.xml
    printf 'package com.example.shtile\nimport android.app.*\nimport android.content.Intent\nimport android.os.*\nimport android.widget.Toast\nimport androidx.core.app.NotificationCompat\nclass RunnerService : Service() { override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int { if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) { val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager; if (nm.getNotificationChannel("c") == null) nm.createNotificationChannel(NotificationChannel("c", "c", NotificationManager.IMPORTANCE_MIN)) }; try { startForeground(1, NotificationCompat.Builder(this, "c").setSmallIcon(android.R.drawable.stat_notify_sync_noanim).build()) } catch (e: Exception) {}; val a = intent?.action; Thread { try { val p = getSharedPreferences("GucciPrefs", MODE_PRIVATE); val c = if (a == "BRUTAL") "cd /data/local/tmp && (echo 2; sleep 5; echo ${p.getString("brutal_option", "7")}; sleep 2) | ./Gucci_brutal" else { val k = p.getString("license_key", "")?.trim(); if (k.isNullOrEmpty()) { Handler(Looper.getMainLooper()).post { Toast.makeText(applicationContext, "Save License Key first!", Toast.LENGTH_LONG).show() }; stopSelf(); return@Thread }; "cd /data/local/tmp && (sleep 4; echo \x27$k\x27; sleep 2) | ./Gucci_core" }; val pr = ProcessBuilder("su", "-c", c).redirectErrorStream(true).start(); pr.inputStream.bufferedReader().readText(); pr.waitFor() } catch (e: Exception) {}; stopForeground(true); stopSelf() }.start(); return START_NOT_STICKY }; override fun onBind(intent: Intent?): IBinder? = null }' > app/src/main/java/com/example/shtile/RunnerService.kt
    printf 'package com.example.shtile\nimport android.content.Intent\nimport android.os.Build\nimport android.service.quicksettings.Tile\nimport android.service.quicksettings.TileService\nclass SafeTileService : TileService() { override fun onStartListening() { qsTile?.apply { label = "Boost"; state = Tile.STATE_INACTIVE; updateTile() } }; override fun onClick() { val i = Intent(this, RunnerService::class.java).apply { action = "NORMAL" }; if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i) else startService(i) } }' > app/src/main/java/com/example/shtile/SafeTileService.kt
    printf 'package com.example.shtile\nimport android.content.Intent\nimport android.os.Build\nimport android.service.quicksettings.Tile\nimport android.service.quicksettings.TileService\nclass BrutalTileService : TileService() { override fun onStartListening() { qsTile?.apply { label = "Turbo Mode"; state = Tile.STATE_INACTIVE; updateTile() } }; override fun onClick() { val i = Intent(this, RunnerService::class.java).apply { action = "BRUTAL" }; if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i) else startService(i) } }' > app/src/main/java/com/example/shtile/BrutalTileService.kt
    printf 'package com.example.shtile\nimport android.content.ComponentName\nimport android.content.pm.PackageManager\nimport android.service.quicksettings.Tile\nimport android.service.quicksettings.TileService\nclass FocusTileService : TileService() { private val c by lazy { ComponentName(applicationContext, "com.example.shtile.MainActivityAlias") }; override fun onStartListening() { updateState() }; override fun onClick() { val pm = packageManager; val s = pm.getComponentEnabledSetting(c); val n = if (s == PackageManager.COMPONENT_ENABLED_STATE_DISABLED) PackageManager.COMPONENT_ENABLED_STATE_ENABLED else PackageManager.COMPONENT_ENABLED_STATE_DISABLED; pm.setComponentEnabledSetting(c, n, PackageManager.DONT_KILL_APP); updateState() }; private fun updateState() { val s = packageManager.getComponentEnabledSetting(c); qsTile?.apply { label = "Focus Mode"; state = if (s == PackageManager.COMPONENT_ENABLED_STATE_DISABLED) Tile.STATE_ACTIVE else Tile.STATE_INACTIVE; updateTile() } } }' > app/src/main/java/com/example/shtile/FocusTileService.kt
    printf 'package com.example.shtile\nimport android.content.Context\nimport android.content.Intent\nimport android.net.Uri\nimport android.os.Bundle\nimport android.os.Handler\nimport android.os.Looper\nimport android.text.Editable\nimport android.text.TextWatcher\nimport android.widget.*\nimport androidx.appcompat.app.AlertDialog\nimport androidx.appcompat.app.AppCompatActivity\nimport java.io.DataOutputStream\nclass MainActivity : AppCompatActivity() {\noverride fun onCreate(s: Bundle?) {\nsuper.onCreate(s)\nsetContentView(R.layout.activity_main)\nval p = getSharedPreferences("GucciPrefs", Context.MODE_PRIVATE)\nval ki = findViewById<EditText>(R.id.keyInput)\nval bi = findViewById<EditText>(R.id.brutalInput)\nval dn = findViewById<TextView>(R.id.driverNameText)\nval title = findViewById<TextView>(R.id.titleText)\nval sub = findViewById<TextView>(R.id.subtitleText)\nval ca = findViewById<TextView>(R.id.contactAdminText)\nsub.text = android.text.Html.fromHtml("Invisible X Loader Owner- <font color=\x27#00E5A0\x27>GUCCI</font>", android.text.Html.FROM_HTML_MODE_LEGACY)\nki.setText(p.getString("license_key", ""))\nbi.setText(p.getString("brutal_option", "7"))\nval m = mapOf("1" to "QX1", "2" to "GT", "3" to "rt-dev", "4" to "rt-proc", "5" to "QX(2)", "6" to "KPM", "7" to "DitPro KPM", "8" to "KMA KPM", "9" to "LDK KPM", "10" to "Paradise")\nbi.addTextChangedListener(object : TextWatcher {\noverride fun beforeTextChanged(s: CharSequence?, st: Int, c: Int, a: Int) {}\noverride fun onTextChanged(s: CharSequence?, st: Int, b: Int, c: Int) { dn.text = m[s.toString().trim()] ?: "Unknown" }\noverride fun afterTextChanged(s: Editable?) {}\n})\ndn.text = m[bi.text.toString()] ?: "Unknown"\nval openTg = { try { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://t.me/Gucci8240"))) } catch (e: Exception) { Toast.makeText(this, "Telegram not installed", Toast.LENGTH_SHORT).show() } }\ntitle.setOnClickListener { openTg() }\nsub.setOnClickListener { openTg() }\nca.setOnClickListener { openTg() }\nfun chkRoot() {\nThread {\nval r = try {\nval pr = ProcessBuilder("su", "-c", "id").start()\npr.inputStream.bufferedReader().readText().contains("uid=0")\n} catch (e: Exception) { false }\nHandler(Looper.getMainLooper()).post {\nif (!r) {\nval dialogView = layoutInflater.inflate(R.layout.dialog_root, null)\nval dialog = AlertDialog.Builder(this).setView(dialogView).setCancelable(false).create()\ndialog.window?.setBackgroundDrawableResource(android.R.color.transparent)\ndialogView.findViewById<Button>(R.id.btnGrant).setOnClickListener { dialog.dismiss(); chkRoot() }\ndialogView.findViewById<Button>(R.id.btnExit).setOnClickListener { dialog.dismiss(); finish() }\ndialog.show()\n}\n}\n}.start()\n}\nchkRoot()\nfindViewById<Button>(R.id.saveKeyBtn).setOnClickListener {\np.edit().putString("license_key", ki.text.toString().trim()).putString("brutal_option", bi.text.toString().trim()).apply()\nToast.makeText(this, "✅ Configuration Saved", Toast.LENGTH_SHORT).show()\n}\nfindViewById<Button>(R.id.loadFilesBtn).setOnClickListener {\np.edit().putString("license_key", ki.text.toString().trim()).putString("brutal_option", bi.text.toString().trim()).apply()\nInstaller.installAll(this) { ok -> Toast.makeText(this, if (ok) "✅ Files Loaded" else "❌ Failed. Check root.", Toast.LENGTH_SHORT).show() }\n}\nfindViewById<ImageButton>(R.id.homeIcon).setOnClickListener {\nval startMain = Intent(Intent.ACTION_MAIN)\nstartMain.addCategory(Intent.CATEGORY_HOME)\nstartMain.flags = Intent.FLAG_ACTIVITY_NEW_TASK\nstartActivity(startMain)\n}\nfindViewById<ImageButton>(R.id.hideAppsIcon).setOnClickListener {\nThread {\nval pm = packageManager\nval apps = pm.getInstalledApplications(0)\nval appNames = ArrayList<String>()\nval appPkgs = ArrayList<String>()\nfor (app in apps) {\nif (app.packageName != packageName) {\nappNames.add(pm.getApplicationLabel(app).toString())\nappPkgs.add(app.packageName)\n}\n}\nHandler(Looper.getMainLooper()).post {\nval builder = AlertDialog.Builder(this)\nbuilder.setTitle("Select App to Hide")\nbuilder.setItems(appNames.toTypedArray()) { _, which ->\nval selectedPkg = appPkgs[which]\nval hideTypeBuilder = AlertDialog.Builder(this)\nhideTypeBuilder.setTitle("Hide ${appNames[which]}")\nhideTypeBuilder.setMessage("Choose hide mode:")\nhideTypeBuilder.setPositiveButton("Normal Hide") { _, _ -> runRootCmd("pm disable-user --user 0 $selectedPkg") }\nhideTypeBuilder.setNeutralButton("Complete Hide") { _, _ -> runRootCmd("pm hide $selectedPkg") }\nhideTypeBuilder.setNegativeButton("Cancel", null)\nhideTypeBuilder.show()\n}\nbuilder.show()\n}\n}.start()\n}\n}\nfun runRootCmd(cmd: String) {\nThread {\ntry {\nval p = Runtime.getRuntime().exec("su")\nval os = DataOutputStream(p.outputStream)\nos.writeBytes(cmd + "\\n")\nos.writeBytes("exit\\n")\nos.flush()\nos.close()\np.waitFor()\nHandler(Looper.getMainLooper()).post { Toast.makeText(applicationContext, "Executed!", Toast.LENGTH_SHORT).show() }\n} catch (e: Exception) {}\n}.start()\n}\n}' > app/src/main/java/com/example/shtile/MainActivity.kt
    gradle assembleDebug
- name: Upload APK
  uses: actions/upload-artifact@v4
  with:
    name: INX-Loader-APK
    path: app/build/outputs/apk/debug/app-debug.apk
printf 'package com.example.shtile\nimport android.content.Context\nimport android.os.Handler\nimport android.os.Looper\nimport java.io.File\nobject Installer { fun installAll(context: Context, onDone: ((Boolean) -> Unit)? = null) { Thread { var ok = true; for (n in listOf("Gucci_core", "Gucci_brutal")) { try { val b = context.assets.open(n).readBytes(); val t = File(context.cacheDir, n); t.writeBytes(b); val p = ProcessBuilder("su", "-c", "cp ${t.absolutePath} /data/local/tmp/$n && chmod 777 /data/local/tmp/$n").redirectErrorStream(true).start(); p.inputStream.bufferedReader().readText(); if (p.waitFor() != 0) ok = false; t.delete() } catch (e: Exception) { ok = false } }; Handler(Looper.getMainLooper()).post { onDone?.invoke(ok) } }.start() } }' > app/src/main/java/com/example/shtile/Installer.kt
