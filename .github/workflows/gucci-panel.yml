name: Settings APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          export PATH="$PWD/gradle-8.2/bin:$PATH"

          rm -rf app build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/example/shtile
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          if [ -f "Gucci_core" ]; then
            cp Gucci_core app/src/main/assets/Gucci_core
            echo "✓ Gucci_core bundled"
          else
            echo "⚠ Gucci_core not found in repo root"
          fi

          if [ -f "Gucci_brutal" ]; then
            cp Gucci_brutal app/src/main/assets/Gucci_brutal
            echo "✓ Gucci_brutal bundled"
          else
            echo "⚠ Gucci_brutal not found in repo root"
          fi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Settings"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.shtile'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.shtile"
                  minSdk 24
                  targetSdk 34
                  versionCode 30
                  versionName "30.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:allowBackup="true"
                  android:label="Settings"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".RunnerService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync"/>

                  <service
                      android:name=".SafeTileService"
                      android:exported="true"
                      android:icon="@drawable/ic_tile_normal"
                      android:label="Boost"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE"/>
                      </intent-filter>
                  </service>

                  <service
                      android:name=".BrutalTileService"
                      android:exported="true"
                      android:icon="@drawable/ic_tile_brutal"
                      android:label="Turbo Mode"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE"/>
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/shtile/Installer.kt <<'EOF'
          package com.example.shtile

          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import android.widget.Toast
          import java.io.File

          object Installer {
              private val FILES = listOf("Gucci_core", "Gucci_brutal")

              fun installAll(context: Context, onDone: ((Boolean) -> Unit)? = null) {
                  Thread {
                      var allOk = true
                      for (name in FILES) {
                          try {
                              val bytes = context.assets.open(name).readBytes()
                              val tmp = File(context.cacheDir, name)
                              tmp.writeBytes(bytes)

                              val target = "/data/local/tmp/$name"
                              val cmd = "cp ${tmp.absolutePath} $target && chmod 755 $target"
                              val p = ProcessBuilder("su", "-c", cmd)
                                  .redirectErrorStream(true).start()
                              p.inputStream.bufferedReader().readText()
                              val code = p.waitFor()
                              if (code != 0) allOk = false
                              tmp.delete()
                          } catch (e: Exception) {
                              allOk = false
                          }
                      }
                      Handler(Looper.getMainLooper()).post {
                          Toast.makeText(context,
                              if (allOk) "Files installed to /data/local/tmp"
                              else "Some files failed",
                              Toast.LENGTH_LONG).show()
                          onDone?.invoke(allOk)
                      }
                  }.start()
              }
          }
          EOF

          cat > app/src/main/java/com/example/shtile/Runner.kt <<'EOF'
          package com.example.shtile

          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import android.widget.Toast

          object Runner {
              fun runNormal(context: Context) {
                  Thread {
                      val code = try {
                          val p = ProcessBuilder("su", "-c", "cd /data/local/tmp && ./Gucci_core")
                              .redirectErrorStream(true).start()
                          p.inputStream.bufferedReader().readText()
                          p.waitFor()
                      } catch (e: Exception) { -1 }
                      Handler(Looper.getMainLooper()).post {
                          Toast.makeText(context,
                              if (code == 0) "GUCCI CORE Done" else "GUCCI CORE Exit $code",
                              Toast.LENGTH_SHORT).show()
                      }
                  }.start()
              }

              fun runBrutal(context: Context) {
                  Thread {
                      val code = try {
                          val p = ProcessBuilder("su", "-c",
                              "cd /data/local/tmp && (echo 2; sleep 4; echo 7; sleep 2) | ./Gucci_brutal")
                              .redirectErrorStream(true).start()
                          p.inputStream.bufferedReader().readText()
                          p.waitFor()
                      } catch (e: Exception) { -1 }
                      Handler(Looper.getMainLooper()).post {
                          Toast.makeText(context,
                              if (code == 0) "Gucci Brutal Done" else "Gucci Brutal Exit $code",
                              Toast.LENGTH_SHORT).show()
                      }
                  }.start()
              }
          }
          EOF

          cat > app/src/main/java/com/example/shtile/RunnerService.kt <<'EOF'
          package com.example.shtile

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat

          class RunnerService : Service() {

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val channelId = "runner_channel"

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                      nm.deleteNotificationChannel(channelId)
                      val chan = NotificationChannel(
                          channelId,
                          "Runner",
                          NotificationManager.IMPORTANCE_MIN
                      ).apply {
                          setShowBadge(false)
                          enableLights(false)
                          enableVibration(false)
                          setSound(null, null)
                      }
                      nm.createNotificationChannel(chan)
                  }

                  val notif: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("")
                      .setContentText("")
                      .setSmallIcon(android.R.drawable.stat_notify_sync_noanim)
                      .setPriority(NotificationCompat.PRIORITY_MIN)
                      .setSilent(true)
                      .setOngoing(true)
                      .build()

                  try {
                      startForeground(1, notif)
                  } catch (e: Exception) {}

                  val action = intent?.action
                  Thread {
                      try {
                          val cmd = if (action == "com.example.shtile.RUN_BRUTAL") {
                              "cd /data/local/tmp && (echo 2; sleep 4; echo 7; sleep 2) | ./Gucci_brutal"
                          } else {
                              "cd /data/local/tmp && ./Gucci_core"
                          }
                          val p = ProcessBuilder("su", "-c", cmd)
                              .redirectErrorStream(true).start()
                          p.inputStream.bufferedReader().readText()
                          p.waitFor()
                      } catch (e: Exception) {}

                      try {
                          stopForeground(true)
                      } catch (e: Exception) {}
                      stopSelf()
                  }.start()

                  return START_NOT_STICKY
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          cat > app/src/main/java/com/example/shtile/SafeTileService.kt <<'EOF'
          package com.example.shtile

          import android.content.Intent
          import android.os.Build
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService

          class SafeTileService : TileService() {
              override fun onStartListening() {
                  super.onStartListening()
                  qsTile?.apply {
                      label = "Boost"
                      state = Tile.STATE_INACTIVE
                      updateTile()
                  }
              }
              override fun onClick() {
                  super.onClick()
                  val i = Intent(this, RunnerService::class.java).apply {
                      action = "com.example.shtile.RUN_NORMAL"
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(i)
                  } else {
                      startService(i)
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/shtile/BrutalTileService.kt <<'EOF'
          package com.example.shtile

          import android.content.Intent
          import android.os.Build
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService

          class BrutalTileService : TileService() {
              override fun onStartListening() {
                  super.onStartListening()
                  qsTile?.apply {
                      label = "Turbo Mode"
                      state = Tile.STATE_INACTIVE
                      updateTile()
                  }
              }
              override fun onClick() {
                  super.onClick()
                  val i = Intent(this, RunnerService::class.java).apply {
                      action = "com.example.shtile.RUN_BRUTAL"
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(i)
                  } else {
                      startService(i)
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/shtile/MainActivity.kt <<'EOF'
          package com.example.shtile

          import android.os.Build
          import android.os.Bundle
          import android.widget.Button
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var status: TextView
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), 1)
                  }

                  status = findViewById(R.id.status)
                  status.text = "Installing files..."

                  Installer.installAll(this) { ok ->
                      status.text = if (ok) "Files ready in /data/local/tmp"
                                    else "Install failed — check root"
                  }

                  findViewById<Button>(R.id.testSafeBtn).setOnClickListener {
                      status.text = "Running GUCCI CORE..."
                      Runner.runNormal(this)
                  }
                  findViewById<Button>(R.id.testBrutalBtn).setOnClickListener {
                      status.text = "Running Gucci Brutal..."
                      Runner.runBrutal(this)
                  }
                  findViewById<Button>(R.id.launchBtn).setOnClickListener {
                      status.text = "Installing files to /data/local/tmp..."
                      Installer.installAll(this) { ok ->
                          status.text = if (ok) "LAUNCH GUCCI — files ready"
                                        else "LAUNCH GUCCI — failed, check root"
                      }
                  }
              }
          }
          EOF

          cat > app/src/main/res/drawable/bg_launch.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ripple xmlns:android="http://schemas.android.com/apk/res/android"
              android:color="#33FFFFFF">
              <item>
                  <shape android:shape="rectangle">
                      <gradient
                          android:startColor="#00E5A0"
                          android:endColor="#009E70"
                          android:angle="0"/>
                      <corners android:radius="14dp"/>
                  </shape>
              </item>
          </ripple>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:orientation="vertical"
              android:padding="24dp"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <Button android:id="@+id/testSafeBtn"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="GUCCI CORE"/>

              <Button android:id="@+id/testBrutalBtn"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:text="Gucci Brutal"/>

              <TextView android:id="@+id/status"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:paddingTop="16dp"
                  android:typeface="monospace"
                  android:textSize="12sp"/>

              <View
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"/>

              <Button android:id="@+id/launchBtn"
                  android:layout_width="match_parent"
                  android:layout_height="62dp"
                  android:layout_marginBottom="8dp"
                  android:text="LAUNCH GUCCI"
                  android:textColor="#00170E"
                  android:textSize="16sp"
                  android:textStyle="bold"
                  android:letterSpacing="0.08"
                  android:background="@drawable/bg_launch"
                  android:stateListAnimator="@null"
                  android:elevation="6dp"/>
          </LinearLayout>
          EOF

          cat > app/src/main/res/drawable/ic_tile_normal.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M12,2L4,5v6c0,5.55 3.84,10.74 8,12 4.16,-1.26 8,-6.45 8,-12V5l-8,-3z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_tile_brutal.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M7,2v11h3v9l7,-12h-4l4,-8z"/>
          </vector>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">Settings</string></resources>
          EOF

          gradle assembleDebug --no-da
