<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASTER ADMIN</title>
<style>
  :root{--bg:#0a0e14;--panel:#11161f;--border:#232b38;--text:#e6edf3;--muted:#8b949e;--accent:#2dd4a7;--red:#f85149;}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 sans-serif;padding:20px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;max-width:800px;margin:0 auto;}
  input,select{width:100%;padding:10px;margin:6px 0 16px;background:#161c27;border:1px solid var(--border);color:white;border-radius:6px;box-sizing:border-box;}
  button{padding:10px 16px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;}
  .btn-primary{background:var(--accent);color:#000;width:100%;}
  .btn-danger{background:var(--red);color:white;padding:6px 12px;font-size:12px;}
  table{width:100%;border-collapse:collapse;margin-top:20px;}
  th,td{text-align:left;padding:12px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-size:12px;}
  .pill{padding:4px 8px;border-radius:99px;font-size:11px;font-weight:bold;}
  .active{background:#123c30;color:var(--accent);}
  .revoked{background:#3d1714;color:var(--red);}
  .mono{font-family:monospace;}
  .hidden{display:none;}
  .flex{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;}
  h3{color:var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 5px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="card">
  <h2>Admin Login</h2>
  <label>GitHub Username</label>
  <input id="ghUser" placeholder="guccipanelfree">
  <label>Repo Name</label>
  <input id="ghRepo" placeholder="Guccicorenew">
  <label>Token (ghp_...)</label>
  <input id="ghToken" type="password" placeholder="Your GitHub Token">
  <button class="btn-primary" onclick="login()">Connect Admin</button>
  <p id="loginErr" style="color:var(--red);text-align:center;"></p>
</div>

<!-- DASHBOARD -->
<div id="dashScreen" class="card hidden">
  <div class="flex" style="margin-bottom:20px;">
    <h2 style="margin:0; color:var(--red);">👑 MASTER ADMIN</h2>
    <button class="btn-danger" style="padding:10px;" onclick="location.reload()">Logout</button>
  </div>
  
  <!-- CREATE RESELLER -->
  <div style="background:#161c27;padding:15px;border-radius:8px;margin-bottom:20px;">
    <h3 style="margin-top:0;">Create New Reseller</h3>
    <label>Reseller Name (e.g. Rahul)</label>
    <input id="newResellerName" placeholder="Rahul" style="margin-bottom:10px;">
    <label>Starting Credits (Type a number or "Unlimited")</label>
    <input id="newResellerCredits" placeholder="e.g. 5000 or Unlimited" style="margin-bottom:10px;">
    <button class="btn-primary" onclick="createReseller()">Create Reseller</button>
  </div>

  <!-- MANAGE RESELLERS -->
  <h3>Active Resellers</h3>
  <table>
    <thead><tr><th>Name</th><th>Credits</th><th>Action</th></tr></thead>
    <tbody id="resellerTable"></tbody>
  </table>

  <!-- ALL KEYS -->
  <h3 style="margin-top:40px;">All Generated Keys</h3>
  <table>
    <thead><tr><th>Key</th><th>Created By</th><th>Status</th><th>Action</th></tr></thead>
    <tbody id="keyTable"></tbody>
  </table>
</div>

<script>
let S = { user:"", repo:"", token:"", sha:"", data:{resellers:{}, keys:{}} };

async function login() {
  S.user = document.getElementById('ghUser').value.trim();
  S.repo = document.getElementById('ghRepo').value.trim();
  S.token = document.getElementById('ghToken').value.trim();
  
  try {
    await loadData();
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('dashScreen').classList.remove('hidden');
  } catch(e) {
    document.getElementById('loginErr').innerText = "Error: Check your Token or Repo name.";
  }
}

async function loadData() {
  const url = `https://api.github.com/repos/${S.user}/${S.repo}/contents/data.json`;
  const res = await fetch(url, { headers: { "Authorization": `token ${S.token}` } });
  if(!res.ok) throw new Error("Auth Failed");
  const json = await res.json();
  S.sha = json.sha;
  S.data = JSON.parse(atob(json.content));
  render();
}

async function saveData() {
  const url = `https://api.github.com/repos/${S.user}/${S.repo}/contents/data.json`;
  const body = {
    message: "Admin Update",
    content: btoa(JSON.stringify(S.data, null, 2)),
    sha: S.sha
  };
  const res = await fetch(url, {
    method: "PUT",
    headers: { "Authorization": `token ${S.token}`, "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const json = await res.json();
  S.sha = json.content.sha;
  render();
}

function render() {
  const rTbody = document.getElementById('resellerTable');
  rTbody.innerHTML = "";
  Object.keys(S.data.resellers).forEach(name => {
    const r = S.data.resellers[name];
    rTbody.innerHTML += `
      <tr>
        <td style="font-weight:bold;">${name}</td>
        <td style="color:var(--accent);">${r.credits === "Unlimited" ? "∞ Unlimited" : r.credits}</td>
        <td>
          <button class="btn-primary" style="width:auto; padding:6px 12px; margin-bottom:5px;" onclick="addCredits('${name}')">+ Edit</button>
        </td>
      </tr>
    `;
  });

  const kTbody = document.getElementById('keyTable');
  kTbody.innerHTML = "";
  Object.keys(S.data.keys).forEach(key => {
    const k = S.data.keys[key];
    const isExpired = k.expiresAt !== 0 && Date.now() > k.expiresAt;
    const status = k.revoked ? "REVOKED" : (isExpired ? "EXPIRED" : "ACTIVE");
    const pillClass = status === "ACTIVE" ? "active" : "revoked";

    kTbody.innerHTML += `
      <tr>
        <td class="mono">${key}</td>
        <td>${k.createdBy}</td>
        <td><span class="pill ${pillClass}">${status}</span><br><small>${k.tier}</small></td>
        <td><button class="btn-danger" onclick="toggleKey('${key}')">${k.revoked ? 'Restore' : 'Revoke'}</button></td>
      </tr>
    `;
  });
}

async function createReseller() {
  const name = document.getElementById('newResellerName').value.trim();
  let creditsInput = document.getElementById('newResellerCredits').value.trim();

  if(!name || !creditsInput) return alert("Please enter a name and credits.");
  if(S.data.resellers[name]) return alert("Reseller already exists!");

  // Check if they typed Unlimited
  let finalCredits = (creditsInput.toLowerCase() === "unlimited") ? "Unlimited" : parseInt(creditsInput);
  if(finalCredits !== "Unlimited" && isNaN(finalCredits)) return alert("Please enter a valid number or 'Unlimited'.");

  S.data.resellers[name] = { credits: finalCredits };
  await saveData();
  
  document.getElementById('newResellerName').value = "";
  document.getElementById('newResellerCredits').value = "";
  alert(`Reseller ${name} created!`);
}

async function addCredits(name) {
  const amount = prompt(`Enter new credit amount for ${name} (Type a number or "Unlimited"):`);
  if(!amount) return;

  if(amount.toLowerCase() === "unlimited") {
    S.data.resellers[name].credits = "Unlimited";
  } else {
    if(isNaN(amount)) return alert("Invalid number.");
    S.data.resellers[name].credits = parseInt(amount);
  }
  
  await saveData();
  alert(`Updated ${name} to ${S.data.resellers[name].credits}`);
}

async function toggleKey(key) {
  S.data.keys[key].revoked = !S.data.keys[key].revoked;
  await saveData();
}
</script>
</body>
</html>
