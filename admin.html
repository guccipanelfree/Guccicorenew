<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUCCI Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0a0e14; color: #ffffff; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; }
        
        .card { background-color: #11161f; padding: 24px; border-radius: 12px; border: 1px solid #1f2633; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { color: #2dd4a7; margin-bottom: 20px; font-size: 22px; }
        h3 { color: #ffffff; margin-bottom: 15px; font-size: 18px; }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #8b949e; }
        input, select { width: 100%; padding: 12px; background-color: #1a222c; border: 1px solid #2a3645; border-radius: 8px; color: white; font-size: 15px; outline: none; }
        input:focus, select:focus { border-color: #2dd4a7; }
        
        button { width: 100%; padding: 14px; background-color: #2dd4a7; color: #000000; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #24b78f; }
        button.danger { background-color: #ff4d4d; color: white; margin-top: 10px; }
        button.danger:hover { background-color: #e60000; }
        button.refresh { background-color: #1a222c; color: #2dd4a7; border: 1px solid #2dd4a7; margin-bottom: 15px; }
        
        .hidden { display: none !important; }
        .msg { margin-top: 10px; font-size: 14px; text-align: center; font-weight: bold; }
        .msg.success { color: #2dd4a7; }
        .msg.error { color: #ff4d4d; }

        /* Key List Table */
        .key-item { background-color: #1a222c; border-radius: 8px; padding: 12px; margin-bottom: 10px; border-left: 4px solid #2dd4a7; }
        .key-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .key-title { font-weight: bold; font-size: 16px; color: #ffffff; word-break: break-all; }
        .key-status { font-size: 12px; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .status-bound { background-color: rgba(45, 212, 167, 0.2); color: #2dd4a7; }
        .status-unbound { background-color: rgba(255, 77, 77, 0.2); color: #ff4d4d; }
        .status-revoked { background-color: #333; color: #888; }
        .key-details { font-size: 12px; color: #8b949e; line-height: 1.5; }
        
        .btn-revoke { background-color: transparent; color: #ff4d4d; border: 1px solid #ff4d4d; padding: 6px 12px; width: auto; font-size: 12px; border-radius: 4px; }
        .btn-revoke:hover { background-color: rgba(255, 77, 77, 0.1); }
    </style>
</head>
<body>

<div class="container">
    <!-- LOGIN CARD -->
    <div class="card" id="loginCard">
        <h2>Admin Login</h2>
        <div class="input-group">
            <label>GitHub Username</label>
            <input type="text" id="ghUser" placeholder="guccipanelfree">
        </div>
        <div class="input-group">
            <label>Repository Name</label>
            <input type="text" id="ghRepo" placeholder="Guccicorenew">
        </div>
        <div class="input-group">
            <label>GitHub Token (ghp_...)</label>
            <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxx">
        </div>
        <button onclick="connectAdmin()">Connect</button>
        <div id="loginMsg" class="msg error"></div>
    </div>

    <!-- DASHBOARD CARD -->
    <div class="card hidden" id="dashboardCard">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">Admin Dashboard</h2>
            <button class="btn-revoke" style="color: #8b949e; border-color: #8b949e;" onclick="logout()">Logout</button>
        </div>

        <div class="input-group">
            <label>Key Duration</label>
            <select id="keyDuration">
                <option value="1">1 Day</option>
                <option value="7">7 Days</option>
                <option value="30">30 Days</option>
                <option value="0">Lifetime</option>
            </select>
        </div>
        <button onclick="generateKey()">Generate New Key</button>
        <div id="genMsg" class="msg"></div>

        <hr style="border: 0; border-top: 1px solid #1f2633; margin: 25px 0;">

        <h3>Active Keys</h3>
        <button class="refresh" onclick="loadKeys()">Refresh List</button>
        <div id="keysContainer"></div>
    </div>
</div>

<script>
    let token, user, repo, currentSha, currentJson;

    function connectAdmin() {
        user = document.getElementById('ghUser').value.trim();
        repo = document.getElementById('ghRepo').value.trim();
        token = document.getElementById('ghToken').value.trim();
        const msg = document.getElementById('loginMsg');

        if(!user || !repo || !token) {
            msg.innerText = "Please fill all fields."; return;
        }

        msg.innerText = "Connecting...";
        msg.className = "msg";

        fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.json`, {
            headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github.v3+json" }
        })
        .then(res => {
            if(!res.ok) throw new Error("Check your Token or Repo name.");
            return res.json();
        })
        .then(data => {
            currentSha = data.sha;
            currentJson = JSON.parse(atob(data.content));
            
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('dashboardCard').classList.remove('hidden');
            renderKeys();
        })
        .catch(err => {
            msg.innerText = "Error: " + err.message;
            msg.className = "msg error";
        });
    }

    function loadKeys() {
        fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.json`, {
            headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github.v3+json" }
        })
        .then(res => res.json())
        .then(data => {
            currentSha = data.sha;
            currentJson = JSON.parse(atob(data.content));
            renderKeys();
        });
    }

    function generateKey() {
        const days = parseInt(document.getElementById('keyDuration').value);
        const randomStr = Math.random().toString(36).substring(2, 8).toUpperCase();
        const newKey = "GUCCI-" + randomStr;
        
        let expiresAt = 0;
        if(days > 0) {
            expiresAt = Date.now() + (days * 24 * 60 * 60 * 1000);
        }

        if(!currentJson.keys) currentJson.keys = {};

        // Generate the key with Auto-Bind defaults (Empty HWID array)
        currentJson.keys[newKey] = {
            "deviceIds": [],
            "maxDevices": 1,
            "revoked": false,
            "expiresAt": expiresAt
        };

        saveToGitHub(`Generated key ${newKey}`, document.getElementById('genMsg'));
    }

    function revokeKey(keyName) {
        if(!confirm(`Are you sure you want to revoke ${keyName}?`)) return;
        currentJson.keys[keyName].revoked = true;
        saveToGitHub(`Revoked key ${keyName}`);
    }

    function saveToGitHub(commitMsg, msgElement) {
        const newContent = btoa(JSON.stringify(currentJson, null, 2));
        
        fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.json`, {
            method: 'PUT',
            headers: {
                "Authorization": `Bearer ${token}`,
                "Accept": "application/vnd.github.v3+json",
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: commitMsg,
                content: newContent,
                sha: currentSha
            })
        })
        .then(res => {
            if(!res.ok) throw new Error("Failed to save. Check token permissions.");
            return res.json();
        })
        .then(data => {
            currentSha = data.content.sha;
            renderKeys();
            if(msgElement) {
                msgElement.innerText = "✅ " + commitMsg;
                msgElement.className = "msg success";
                setTimeout(() => msgElement.innerText = "", 3000);
            }
        })
        .catch(err => {
            alert(err.message);
        });
    }

    function renderKeys() {
        const container = document.getElementById('keysContainer');
        container.innerHTML = "";
        
        const keys = currentJson.keys || {};
        const keyNames = Object.keys(keys).reverse(); // Show newest first

        if(keyNames.length === 0) {
            container.innerHTML = "<p style='color:#8b949e; font-size:14px;'>No keys generated yet.</p>";
            return;
        }

        keyNames.forEach(k => {
            const data = keys[k];
            let statusHtml = "";
            
            if(data.revoked) {
                statusHtml = `<span class="key-status status-revoked">REVOKED</span>`;
            } else if(data.deviceIds && data.deviceIds.length > 0) {
                statusHtml = `<span class="key-status status-bound">BOUND</span>`;
            } else {
                statusHtml = `<span class="key-status status-unbound">UNBOUND</span>`;
            }

            let expiryText = data.expiresAt === 0 ? "Lifetime" : new Date(data.expiresAt).toLocaleString();
            let hwidText = (data.deviceIds && data.deviceIds.length > 0) ? data.deviceIds[0] : "Waiting for user to login...";
            
            let revokeBtn = data.revoked ? "" : `<button class="btn-revoke" onclick="revokeKey('${k}')">Revoke</button>`;

            container.innerHTML += `
                <div class="key-item" style="border-left-color: ${data.revoked ? '#888' : (data.deviceIds.length > 0 ? '#2dd4a7' : '#ff4d4d')}">
                    <div class="key-header">
                        <span class="key-title">${k}</span>
                        ${statusHtml}
                    </div>
                    <div class="key-details">
                        <b>HWID:</b> ${hwidText} <br>
                        <b>Expires:</b> ${expiryText}
                    </div>
                    ${revokeBtn}
                </div>
            `;
        });
    }

    function logout() {
        location.reload();
    }
</script>

</body>
</html>
