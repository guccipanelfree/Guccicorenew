<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUCCI Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0a0e14; color: #ffffff; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 700px; }
        .card { background-color: #11161f; padding: 24px; border-radius: 12px; border: 1px solid #1f2633; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { color: #2dd4a7; margin-bottom: 20px; font-size: 22px; }
        h3 { color: #ffffff; margin-bottom: 15px; font-size: 18px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #8b949e; }
        input[type="text"], input[type="password"], select { width: 100%; padding: 12px; background-color: #1a222c; border: 1px solid #2a3645; border-radius: 8px; color: white; font-size: 15px; outline: none; }
        input:focus, select:focus { border-color: #2dd4a7; }
        button { padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .btn-main { width: 100%; background-color: #2dd4a7; color: #000000; font-size: 16px; padding: 14px; }
        .btn-main:hover { background-color: #24b78f; }
        .hidden { display: none !important; }
        .msg { margin-top: 10px; font-size: 14px; text-align: center; font-weight: bold; }
        .msg.success { color: #2dd4a7; }
        .msg.error { color: #ff4d4d; }
        
        .global-actions { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn-global-off { background-color: #ff4d4d; color: white; flex: 1; min-width: 45%; }
        .btn-global-on { background-color: #2dd4a7; color: black; flex: 1; min-width: 45%; }
        .btn-delete-all { background-color: #c0392b; color: white; flex: 1; border: 1px solid #e74c3c; min-width: 100%; }
        .btn-reboot { background-color: #e67e22; color: white; flex: 1; border: 1px solid #d35400; min-width: 100%; }
        
        .key-item { background-color: #1a222c; border-radius: 8px; padding: 15px; margin-bottom: 15px; border-left: 4px solid #2dd4a7; }
        .key-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .key-title { font-weight: bold; font-size: 16px; color: #ffffff; word-break: break-all; }
        .key-status { font-size: 12px; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .status-bound { background-color: rgba(45, 212, 167, 0.2); color: #2dd4a7; }
        .status-unbound { background-color: rgba(255, 77, 77, 0.2); color: #ff4d4d; }
        .status-revoked { background-color: #333; color: #888; }
        .key-details { font-size: 13px; color: #8b949e; line-height: 1.6; margin-bottom: 15px; }
        .key-details b { color: #ffffff; }
        .action-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .btn-action { flex: 1; padding: 8px; font-size: 12px; text-align: center; border-radius: 6px; }
        .btn-reset { background-color: #f39c12; color: white; }
        .btn-edit { background-color: #3498db; color: white; }
        .btn-toggle { background-color: #9b59b6; color: white; }
        .btn-delete { background-color: #e74c3c; color: white; }
        .btn-copy { background-color: #3498db; color: white; padding: 4px 8px; font-size: 11px; border-radius: 4px; margin-left: 10px; }
        .btn-reboot-key { background-color: #e67e22; color: white; flex: 1; padding: 8px; font-size: 12px; text-align: center; border-radius: 6px; }
        .btn-reboot-timer { background-color: #d35400; color: white; flex: 1; padding: 8px; font-size: 12px; text-align: center; border-radius: 6px; }
        
        .feature-toggles { display: flex; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #2a3645; flex-wrap: wrap; }
        .feature-label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #ffffff; cursor: pointer; background: #11161f; padding: 6px 10px; border-radius: 6px; border: 1px solid #2a3645; }
        .feature-label input { accent-color: #2dd4a7; width: 16px; height: 16px; cursor: pointer; }
        .btn-uncheck { background: #333; color: #ff4d4d; border: 1px solid #ff4d4d; padding: 6px 10px; font-size: 12px; border-radius: 6px; cursor: pointer; margin-left: 5px; }
        .btn-check { background: #333; color: #2dd4a7; border: 1px solid #2dd4a7; padding: 6px 10px; font-size: 12px; border-radius: 6px; cursor: pointer; margin-left: 5px; }
        
        .search-container { margin-bottom: 15px; position: relative; }
        .search-container input { width: 100%; padding: 12px 12px 12px 40px; background-color: #1a222c; border: 1px solid #2a3645; border-radius: 8px; color: white; font-size: 14px; }
        .search-container::before { content: '🔍'; position: absolute; left: 12px; top: 12px; font-size: 16px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card" id="loginCard">
        <h2>Admin Login</h2>
        <div class="input-group"><label>GitHub Username</label><input type="text" id="ghUser" placeholder="guccipanelfree"></div>
        <div class="input-group"><label>Repository Name</label><input type="text" id="ghRepo" placeholder="Guccicorenew"></div>
        <div class="input-group"><label>GitHub Token (ghp_...)</label><input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxx"></div>
        <button class="btn-main" onclick="connectAdmin()">Connect</button>
        <div id="loginMsg" class="msg error"></div>
    </div>

    <div class="card hidden" id="dashboardCard">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">Admin Dashboard</h2>
            <button style="background: transparent; color: #8b949e; border: 1px solid #8b949e; padding: 6px 12px;" onclick="logout()">Logout</button>
        </div>

        <div class="input-group">
            <label>Custom Key (Leave empty for Random Key)</label>
            <input type="text" id="customKeyInput" placeholder="e.g. GUCCI-VIP-2024" style="text-transform: uppercase;">
        </div>

        <div class="input-group">
            <label>Key Duration (For New Keys)</label>
            <select id="keyDuration">
                <option value="1">1 Day</option>
                <option value="7">7 Days</option>
                <option value="30">30 Days</option>
                <option value="0">Lifetime</option>
            </select>
        </div>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <label style="color: #2dd4a7; font-weight: bold; margin: 0;">Select Features to Unlock:</label>
            <div>
                <button class="btn-check" onclick="checkAllFeatures()">Check All</button>
                <button class="btn-uncheck" onclick="uncheckAllFeatures()">Uncheck All</button>
            </div>
        </div>

        <div class="feature-toggles" style="margin-bottom: 20px; border: none; padding: 0;">
            <label class="feature-label"><input type="checkbox" id="allowInx" checked> Allow INX</label>
            <label class="feature-label"><input type="checkbox" id="allowFloater" checked> Allow Floater</label>
            <label class="feature-label"><input type="checkbox" id="allowKernel" checked> Allow Kernel</label>
        </div>

        <button class="btn-main" style="margin-bottom: 25px;" onclick="generateKey()">Generate New Key</button>
        <div id="genMsg" class="msg"></div>

        <hr style="border: 0; border-top: 1px solid #1f2633; margin: 25px 0;">

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>Active Keys</h3>
            <button style="background: #1a222c; color: #2dd4a7; border: 1px solid #2dd4a7; padding: 6px 12px; font-size: 12px;" onclick="loadKeys()">Refresh</button>
        </div>
        
        <div class="global-actions" style="margin-top: 15px;">
            <button class="btn-global-off" onclick="toggleAllKeys(true)">🚨 Kill ALL Keys</button>
            <button class="btn-global-on" onclick="toggleAllKeys(false)">✅ Enable ALL Keys</button>
            <button class="btn-delete-all" onclick="deleteAllKeys()">🗑️ Delete ALL Keys</button>
            <button class="btn-global-on" onclick="toggleAllFeatures(true)">🔓 Unlock ALL Features</button>
            <button class="btn-global-off" onclick="toggleAllFeatures(false)">🔒 Lock ALL Features</button>
            <button class="btn-reboot" onclick="rebootAllDevices()">🔄 Reboot ALL Devices</button>
        </div>

        <div class="search-container">
            <input type="text" id="searchKey" oninput="renderKeys()" placeholder="Search by Key or HWID...">
        </div>

        <div id="keysContainer"></div>
    </div>
</div>
<script>
    let token, user, repo, currentSha, currentJson;

    function connectAdmin() {
        user = document.getElementById('ghUser').value.trim();
        repo = document.getElementById('ghRepo').value.trim();
        token = document.getElementById('ghToken').value.trim();
        const msg = document.getElementById('loginMsg');
        if(!user || !repo || !token) { msg.innerText = "Please fill all fields."; return; }
        msg.innerText = "Connecting..."; msg.className = "msg";
        fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.json`, {
            headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github.v3+json" }
        })
        .then(res => { if(!res.ok) throw new Error("Check your Token or Repo name."); return res.json(); })
        .then(data => {
            currentSha = data.sha;
            currentJson = JSON.parse(atob(data.content));
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('dashboardCard').classList.remove('hidden');
            renderKeys();
        })
        .catch(err => { msg.innerText = "Error: " + err.message; msg.className = "msg error"; });
    }

    function loadKeys() {
        document.getElementById('searchKey').value = '';
        fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.json`, {
            headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github.v3+json" }
        })
        .then(res => res.json())
        .then(data => {
            currentSha = data.sha;
            currentJson = JSON.parse(atob(data.content));
            renderKeys();
        });
    }

    function saveToGitHub(commitMsg, msgElement) {
        const newContent = btoa(JSON.stringify(currentJson, null, 2));
        fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.json`, {
            method: 'PUT',
            headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github.v3+json", "Content-Type": "application/json" },
            body: JSON.stringify({ message: commitMsg, content: newContent, sha: currentSha })
        })
        .then(res => { if(!res.ok) throw new Error("Failed to save."); return res.json(); })
        .then(data => {
            currentSha = data.content.sha;
            renderKeys(); 
            if(msgElement) { msgElement.innerText = "✅ " + commitMsg; msgElement.className = "msg success"; setTimeout(() => msgElement.innerText = "", 3000); }
        })
        .catch(err => { alert(err.message); });
    }

    function copyKey(text) {
        navigator.clipboard.writeText(text).then(() => { alert("✅ Key Copied: " + text); }).catch(err => { alert("❌ Failed to copy: " + err); });
    }

    function updateFeature(keyName, featureName, isChecked) {
        currentJson.keys[keyName][featureName] = isChecked;
        saveToGitHub(`Updated ${featureName} for ${keyName} to ${isChecked}`);
    }

    function checkAllFeatures() { document.getElementById('allowInx').checked = true; document.getElementById('allowFloater').checked = true; document.getElementById('allowKernel').checked = true; }
    function uncheckAllFeatures() { document.getElementById('allowInx').checked = false; document.getElementById('allowFloater').checked = false; document.getElementById('allowKernel').checked = false; }

    function generateKey() {
        const days = parseInt(document.getElementById('keyDuration').value);
        const allowInx = document.getElementById('allowInx').checked;
        const allowFloater = document.getElementById('allowFloater').checked;
        const allowKernel = document.getElementById('allowKernel').checked;
        let newKey = document.getElementById('customKeyInput').value.trim().toUpperCase();
        
        if (!newKey) {
            const randomStr = Math.random().toString(36).substring(2, 8).toUpperCase();
            newKey = "GUCCI-" + randomStr;
        } else {
            if (currentJson.keys && currentJson.keys[newKey]) {
                if(!confirm(`⚠️ Key "${newKey}" already exists! Do you want to OVERWRITE it?`)) return;
            }
        }

        let expiresAt = days > 0 ? Date.now() + (days * 24 * 60 * 60 * 1000) : 0;
        if(!currentJson.keys) currentJson.keys = {};
        
        currentJson.keys[newKey] = { 
            "deviceIds": [], "maxDevices": 1, "revoked": false, "expiresAt": expiresAt,
            "allowInx": allowInx, "allowFloater": allowFloater, "allowKernel": allowKernel,
            "reboot_now": false, "reboot_timer": 0
        };
        document.getElementById('customKeyInput').value = "";
        saveToGitHub(`Generated key ${newKey}`, document.getElementById('genMsg'));
    }

    function resetHwid(keyName) {
        if(!confirm(`Reset HWID for ${keyName}? This unbinds the device.`)) return;
        currentJson.keys[keyName].deviceIds = [];
        saveToGitHub(`Reset HWID for ${keyName}`);
    }

    function editDays(keyName) {
        let days = prompt("Enter days (0 for Lifetime):");
        if(days !== null) {
            days = parseInt(days);
            if(isNaN(days)) return alert("Invalid number");
            let newExp = days === 0 ? 0 : Date.now() + (days * 24 * 60 * 60 * 1000);
            currentJson.keys[keyName].expiresAt = newExp;
            saveToGitHub(`Edited expiry for ${keyName} to ${days} days`);
        }
    }

    function toggleKey(keyName) {
        let currentState = currentJson.keys[keyName].revoked;
        currentJson.keys[keyName].revoked = !currentState;
        let action = !currentState ? "Revoked" : "Unrevoked";
        saveToGitHub(`${action} key ${keyName}`);
    }

    function deleteKey(keyName) {
        if(!confirm(`Are you sure you want to permanently DELETE ${keyName}?`)) return;
        delete currentJson.keys[keyName];
        saveToGitHub(`Deleted key ${keyName}`);
    }

    function toggleAllKeys(state) {
        let action = state ? "Revoke" : "Unrevoke";
        if(!confirm(`Are you sure you want to ${action} ALL keys?`)) return;
        for(let k in currentJson.keys) { currentJson.keys[k].revoked = state; }
        saveToGitHub(`Toggled ALL keys to ${action}`);
    }

    function toggleAllFeatures(state) {
        let action = state ? "Unlock" : "Lock";
        if(!confirm(`Are you sure you want to ${action} ALL features (INX, Floater, Kernel) for EVERY key?`)) return;
        for(let k in currentJson.keys) {
            currentJson.keys[k].allowInx = state;
            currentJson.keys[k].allowFloater = state;
            currentJson.keys[k].allowKernel = state;
        }
        saveToGitHub(`Toggled ALL features to ${action} for ALL keys`);
    }

    function deleteAllKeys() {
        if(!confirm("⚠️ WARNING: Are you absolutely sure you want to DELETE EVERY SINGLE KEY?\n\nThis cannot be undone!")) return;
        if(!confirm("🚨 FINAL WARNING: ALL USERS WILL BE LOGGED OUT AND KEYS WILL BE DESTROYED.\n\nProceed?")) return;
        currentJson.keys = {};
        saveToGitHub(`🚨 DELETED ALL KEYS`);
    }

    // NEW: Reboot Functions
    function rebootAllDevices() {
        if(!confirm("⚠️ Are you sure you want to REBOOT ALL DEVICES?\n\nAll active phones will restart immediately.")) return;
        currentJson.reboot_global = true;
        saveToGitHub("🚨 REBOOT ALL DEVICES INITIATED");
    }

    function rebootKey(keyName) {
        if(!confirm(`Are you sure you want to REBOOT the phone using ${keyName}?`)) return;
        currentJson.keys[keyName].reboot_now = true;
        saveToGitHub(`🔄 Reboot command sent for ${keyName}`);
    }

    function setRebootTimer(keyName) {
        let mins = prompt("Enter minutes until reboot (e.g. 5, 60):", "5");
        if(mins !== null && mins !== "") {
            mins = parseInt(mins);
            if(isNaN(mins) || mins <= 0) return alert("Invalid minutes");
            currentJson.keys[keyName].reboot_timer = Date.now() + (mins * 60000);
            saveToGitHub(`⏱️ Reboot timer set for ${keyName} in ${mins} minutes`);
        }
    }

    function renderKeys() {
        const container = document.getElementById('keysContainer');
        container.innerHTML = "";
        const keys = currentJson.keys || {};
        const keyNames = Object.keys(keys).reverse();
        const searchVal = document.getElementById('searchKey').value.toLowerCase();

        if(keyNames.length === 0) { 
            container.innerHTML = "<p style='color:#8b949e; font-size:14px; text-align:center;'>No keys found.</p>"; 
            return; 
        }
        
        let hasVisibleKeys = false;

        keyNames.forEach(k => {
            const data = keys[k];
            let hwidText = (data.deviceIds && data.deviceIds.length > 0) ? data.deviceIds[0] : "None";
            
            if(searchVal && !k.toLowerCase().includes(searchVal) && !hwidText.toLowerCase().includes(searchVal)) return;
            hasVisibleKeys = true;

            let statusHtml = data.revoked ? `<span class="key-status status-revoked">REVOKED</span>` : 
                             (data.deviceIds && data.deviceIds.length > 0 ? `<span class="key-status status-bound">BOUND</span>` : `<span class="key-status status-unbound">UNBOUND</span>`);
            let expiryText = data.expiresAt === 0 ? "Lifetime" : new Date(data.expiresAt).toLocaleString();
            let toggleText = data.revoked ? "Unrevoke" : "Revoke";
            let toggleColor = data.revoked ? "btn-global-on" : "btn-global-off";
            
            let isInx = data.allowInx !== false;
            let isFloater = data.allowFloater !== false;
            let isKernel = data.allowKernel !== false;

            container.innerHTML += `
                <div class="key-item" style="border-left-color: ${data.revoked ? '#888' : (data.deviceIds.length > 0 ? '#2dd4a7' : '#ff4d4d')}">
                    <div class="key-header">
                        <div style="display: flex; align-items: center;">
                            <span class="key-title">${k}</span>
                            <button class="btn-copy" onclick="copyKey('${k}')">Copy</button>
                        </div>
                        ${statusHtml}
                    </div>
                    
                    <div class="key-details">
                        <b>HWID:</b> ${hwidText} <br>
                        <b>Expires:</b> ${expiryText}
                    </div>

                    <div class="feature-toggles">
                        <label class="feature-label">
                            <input type="checkbox" ${isInx ? 'checked' : ''} onchange="updateFeature('${k}', 'allowInx', this.checked)"> INX
                        </label>
                        <label class="feature-label">
                            <input type="checkbox" ${isFloater ? 'checked' : ''} onchange="updateFeature('${k}', 'allowFloater', this.checked)"> Floater
                        </label>
                        <label class="feature-label">
                            <input type="checkbox" ${isKernel ? 'checked' : ''} onchange="updateFeature('${k}', 'allowKernel', this.checked)"> Kernel
                        </label>
                    </div>

                    <div class="action-row" style="margin-top: 15px;">
                        <button class="btn-action btn-reset" onclick="resetHwid('${k}')">Reset HWID</button>
                        <button class="btn-action btn-edit" onclick="editDays('${k}')">Edit Days</button>
                        <button class="btn-action btn-toggle ${toggleColor}" onclick="toggleKey('${k}')">${toggleText}</button>
                        <button class="btn-action btn-delete" onclick="deleteKey('${k}')">Delete</button>
                    </div>
                    
                    <div class="action-row" style="margin-top: 8px;">
                        <button class="btn-reboot-key" onclick="rebootKey('${k}')">🔄 Reboot Now</button>
                        <button class="btn-reboot-timer" onclick="setRebootTimer('${k}')">⏱️ Set Reboot Timer</button>
                    </div>
                </div>`;
        });

        if(!hasVisibleKeys) {
             container.innerHTML = "<p style='color:#8b949e; font-size:14px; text-align:center;'>No keys matched your search.</p>"; 
        }
    }
    function logout() { location.reload(); }
</script>
</body>
</html>
