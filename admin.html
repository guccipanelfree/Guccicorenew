<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUCCI Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0a0e14; color: #ffffff; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; }

        .card { background-color: #11161f; padding: 24px; border-radius: 12px; border: 1px solid #1f2633; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { color: #2dd4a7; margin-bottom: 20px; font-size: 22px; }
        h3 { color: #ffffff; margin-bottom: 15px; font-size: 18px; }

        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #8b949e; }
        input, select { width: 100%; padding: 12px; background-color: #1a222c; border: 1px solid #2a3645; border-radius: 8px; color: white; font-size: 15px; outline: none; }
        input:focus, select:focus { border-color: #2dd4a7; }

        button { width: 100%; padding: 14px; background-color: #2dd4a7; color: #000000; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #24b78f; }
        button.danger { background-color: #ff4d4d; color: white; margin-top: 10px; }
        button.danger:hover { background-color: #e60000; }
        button.refresh { background-color: #1a222c; color: #2dd4a7; border: 1px solid #2dd4a7; margin-bottom: 15px; }

        .hidden { display: none !important; }
        .msg { margin-top: 10px; font-size: 14px; text-align: center; font-weight: bold; }
        .msg.success { color: #2dd4a7; }
        .msg.error { color: #ff4d4d; }

        .key-item { background-color: #1a222c; border-radius: 8px; padding: 12px; margin-bottom: 10px; border-left: 4px solid #2dd4a7; }
        .key-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .key-title { font-weight: bold; font-size: 16px; color: #ffffff; word-break: break-all; }
        .key-status { font-size: 12px; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .status-bound { background-color: rgba(45, 212, 167, 0.2); color: #2dd4a7; }
        .status-unbound { background-color: rgba(255, 77, 77, 0.2); color: #ff4d4d; }
        .status-revoked { background-color: #333; color: #888; }
        .key-details { font-size: 12px; color: #8b949e; line-height: 1.5; }

        .btn-revoke { background-color: transparent; color: #ff4d4d; border: 1px solid #ff4d4d; padding: 6px 12px; width: auto; font-size: 12px; border-radius: 4px; }
        .btn-revoke:hover { background-color: rgba(255, 77, 77, 0.1); }

        /* ===== NEW STYLES ONLY ADDED ===== */
        textarea {
            width: 100%;
            padding: 12px;
            background-color: #1a222c;
            border: 1px solid #2a3645;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            outline: none;
            font-family: inherit;
            resize: vertical;
        }
        textarea:focus { border-color: #2dd4a7; }

        .device-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: #0f141c;
            border: 1px solid #1f2633;
            border-radius: 6px;
            padding: 6px 8px;
            margin-top: 6px;
        }
        .device-info { display: flex; flex-direction: column; min-width: 0; }
        .dev-name { font-size: 13px; color: #c9d1d9; word-break: break-word; }
        .dev-hwid { font-size: 11px; color: #6e7681; word-break: break-all; }
        .chips { margin-top: 6px; }
        .chip {
            display: inline-block;
            font-size: 11px;
            background: #0f141c;
            border: 1px solid #2a3645;
            color: #8b949e;
            padding: 2px 6px;
            border-radius: 4px;
            margin: 2px 4px 0 0;
            word-break: break-all;
        }
        .btn-mini {
            width: auto;
            padding: 5px 9px;
            font-size: 11px;
            border-radius: 4px;
            background: #0f141c;
            color: #ff4d4d;
            border: 1px solid #5a1f1f;
            font-weight: 600;
        }
        .btn-mini:hover { background: rgba(255, 77, 77, 0.1); }
    </style>
</head>
<body>

<div class="container">
    <div class="card" id="loginCard">
        <h2>Admin Login</h2>
        <div class="input-group">
            <label>GitHub Username</label>
            <input type="text" id="ghUser" placeholder="guccipanelfree">
        </div>
        <div class="input-group">
            <label>Repository Name</label>
            <input type="text" id="ghRepo" placeholder="Guccicorenew">
        </div>
        <div class="input-group">
            <label>GitHub Token (ghp_...)</label>
            <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxx">
        </div>
        <button onclick="connectAdmin()">Connect</button>
        <div id="loginMsg" class="msg error"></div>
    </div>

    <div class="card hidden" id="dashboardCard">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">Admin Dashboard</h2>
            <button class="btn-revoke" style="color: #8b949e; border-color: #8b949e;" onclick="logout()">Logout</button>
        </div>

        <div class="input-group">
            <label>Key Duration</label>
            <select id="keyDuration">
                <option value="1">1 Day</option>
                <option value="7">7 Days</option>
                <option value="30">30 Days</option>
                <option value="0">Lifetime</option>
            </select>
        </div>

        <!-- ===== NEW: DEVICE LIMIT ===== -->
        <div class="input-group">
            <label>Max Devices (1, 2, 3, 4, Unlimited, or Custom)</label>
            <select id="maxDevicesSel" onchange="toggleCustomMax()">
                <option value="1">1 Device</option>
                <option value="2">2 Devices</option>
                <option value="3">3 Devices</option>
                <option value="4">4 Devices</option>
                <option value="0">Unlimited</option>
                <option value="custom">Custom...</option>
            </select>
        </div>

        <div class="input-group hidden" id="customMaxWrap">
            <label>Custom device limit</label>
            <input type="number" id="customMax" min="1" value="2">
        </div>

        <!-- ===== NEW: HWID WHITELIST ===== -->
        <div class="input-group">
            <label>HWID Whitelist (optional — one per line or comma separated; empty = any HWID)</label>
            <textarea id="hwidWhitelist" rows="3" placeholder="ABC123...&#10;DEF456..."></textarea>
        </div>

        <button onclick="generateKey()">Generate New Key</button>
        <div id="genMsg" class="msg"></div>

        <hr style="border: 0; border-top: 1px solid #1f2633; margin: 25px 0;">
        <h3>Active Keys</h3>
        <button class="refresh" onclick="loadKeys()">Refresh List</button>
        <div id="keysContainer"></div>
    </div>
</div>

<script>
    let token, user, repo, currentSha, currentJson;

    function connectAdmin() {
        user = document.getElementById('ghUser').value.trim();
        repo = document.getElementById('ghRepo').value.trim();
        token = document.getElementById('ghToken').value.trim();
        const msg = document.getElementById('loginMsg');

        if(!user || !repo || !token) { msg.innerText = "Please fill all fields."; return; }

        msg.innerText = "Connecting..."; msg.className = "msg";

        fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.json`, {
            headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github.v3+json" }
        })
        .then(res => { if(!res.ok) throw new Error("Check your Token or Repo name."); return res.json(); })
        .then(data => {
            currentSha = data.sha;
            currentJson = JSON.parse(atob(data.content));
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('dashboardCard').classList.remove('hidden');
            renderKeys();
        })
        .catch(err => { msg.innerText = "Error: " + err.message; msg.className = "msg error"; });
    }

    function loadKeys() {
        fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.json`, {
            headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github.v3+json" }
        })
        .then(res => res.json())
        .then(data => {
            currentSha = data.sha;
            currentJson = JSON.parse(atob(data.content));
            renderKeys();
        });
    }

    /* ===== NEW HELPERS ===== */
    function toggleCustomMax() {
        const sel = document.getElementById('maxDevicesSel');
        const wrap = document.getElementById('customMaxWrap');
        if (!sel || !wrap) return;
        wrap.classList.toggle('hidden', sel.value !== 'custom');
    }

    function getSelectedMaxDevices() {
        const sel = document.getElementById('maxDevicesSel');
        if (!sel) return 1;

        if (sel.value === 'custom') {
            const n = parseInt(document.getElementById('customMax').value, 10);
            return (isNaN(n) || n < 1) ? 1 : n;
        }
        return parseInt(sel.value, 10);
    }

    function parseHwidList(text) {
        return [...new Set(
            String(text || '').split(/[\s,;]+/).map(s => s.trim()).filter(Boolean)
        )];
    }

    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    function escapeAttr(value) {
        return escapeHtml(value);
    }

    function generateKey() {
        const days = parseInt(document.getElementById('keyDuration').value);
        const maxDevices = getSelectedMaxDevices();
        const allowedHwids = parseHwidList(document.getElementById('hwidWhitelist').value);

        const randomStr = Math.random().toString(36).substring(2, 8).toUpperCase();
        const newKey = "GUCCI-" + randomStr;
        let expiresAt = days > 0 ? Date.now() + (days * 24 * 60 * 60 * 1000) : 0;

        if(!currentJson.keys) currentJson.keys = {};

        currentJson.keys[newKey] = {
            "deviceIds": [],
            "maxDevices": maxDevices,
            "revoked": false,
            "expiresAt": expiresAt,
            "allowedHwids": allowedHwids,
            "hwidNames": {}
        };

        saveToGitHub(`Generated key ${newKey}`, document.getElementById('genMsg'));
    }

    function revokeKey(keyName) {
        if(!confirm(`Revoke ${keyName}?`)) return;
        currentJson.keys[keyName].revoked = true;
        saveToGitHub(`Revoked key ${keyName}`);
    }

    /* ===== NEW: MANUAL HWID BIND / UNBIND ===== */
    function bindHwid(keyName) {
        const data = currentJson.keys[keyName];
        if(!data) return;

        if(!data.deviceIds) data.deviceIds = [];
        if(!data.hwidNames) data.hwidNames = {};
        if(!data.allowedHwids) data.allowedHwids = [];
        if(typeof data.maxDevices !== 'number') data.maxDevices = 1;

        const hwid = prompt("Enter the HWID you want to allow:");
        if(!hwid) return;
        const cleanHwid = hwid.trim();
        if(!cleanHwid) return;

        if(data.deviceIds.includes(cleanHwid)) {
            return alert("This HWID is already bound.");
        }

        if(data.maxDevices !== 0 && data.deviceIds.length >= data.maxDevices) {
            return alert(`Device limit reached (${data.maxDevices}).`);
        }

        if(data.allowedHwids.length && !data.allowedHwids.includes(cleanHwid)) {
            return alert("This HWID is not in the HWID whitelist for this key.");
        }

        const name = prompt("Device name (optional):", "");
        if(name === null) return;

        data.deviceIds.push(cleanHwid);
        data.hwidNames[cleanHwid] = name.trim() || "Manual entry";

        saveToGitHub(`Bound ${cleanHwid} to ${keyName}`);
    }

    function unbindHwid(keyName, hwid) {
        const data = currentJson.keys[keyName];
        if(!data) return;

        if(!confirm(`Unbind this device from ${keyName}?\n\n${hwid}`)) return;

        data.deviceIds = data.deviceIds.filter(x => x !== hwid);
        if(data.hwidNames) delete data.hwidNames[hwid];

        saveToGitHub(`Unbound ${hwid} from ${keyName}`);
    }

    function saveToGitHub(commitMsg, msgElement) {
        const newContent = btoa(JSON.stringify(currentJson, null, 2));
        fetch(`https://api.github.com/repos/${user}/${repo}/contents/data.json`, {
            method: 'PUT',
            headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github.v3+json", "Content-Type": "application/json" },
            body: JSON.stringify({ message: commitMsg, content: newContent, sha: currentSha })
        })
        .then(res => { if(!res.ok) throw new Error("Failed to save."); return res.json(); })
        .then(data => {
            currentSha = data.content.sha;
            renderKeys();
            if(msgElement) { msgElement.innerText = "✅ " + commitMsg; msgElement.className = "msg success"; setTimeout(() => msgElement.innerText = "", 3000); }
        })
        .catch(err => { alert(err.message); });
    }

    function renderKeys() {
        const container = document.getElementById('keysContainer');
        container.innerHTML = "";
        const keys = currentJson.keys || {};
        const keyNames = Object.keys(keys).reverse();

        if(keyNames.length === 0) {
            container.innerHTML = "<p style='color:#8b949e; font-size:14px;'>No keys generated yet.</p>";
            return;
        }

        keyNames.forEach(k => {
            const data = keys[k];

            if(!data.deviceIds) data.deviceIds = [];
            if(!data.hwidNames) data.hwidNames = {};
            if(!data.allowedHwids) data.allowedHwids = [];
            if(typeof data.maxDevices !== 'number') data.maxDevices = 1;
            if(typeof data.expiresAt !== 'number') data.expiresAt = 0;

            const bound = data.deviceIds.length;
            const maxDevices = data.maxDevices;

            let statusHtml = data.revoked
                ? `<span class="key-status status-revoked">REVOKED</span>`
                : (bound > 0
                    ? `<span class="key-status status-bound">BOUND</span>`
                    : `<span class="key-status status-unbound">UNBOUND</span>`);

            let expiryText = data.expiresAt === 0
                ? "Lifetime"
                : new Date(data.expiresAt).toLocaleString();

            let revokeBtn = data.revoked
                ? ""
                : `<button class="btn-revoke" onclick="revokeKey('${k}')">Revoke</button>`;

            let bindBtn = `<button class="btn-revoke" style="color:#2dd4a7; border-color:#2dd4a7; margin-left:6px;" onclick="bindHwid('${k}')">Bind HWID</button>`;

            let deviceHtml = "";
            if(bound > 0) {
                deviceHtml = data.deviceIds.map(hwid => {
                    const name = data.hwidNames[hwid] || "Unknown device";
                    return `
                        <div class="device-row">
                            <div class="device-info">
                                <span class="dev-name">${escapeHtml(name)}</span>
                                <code class="dev-hwid">${escapeHtml(hwid)}</code>
                            </div>
                            <button class="btn-mini" data-unbind-key="${escapeAttr(k)}" data-unbind-hwid="${escapeAttr(hwid)}">Unbind</button>
                        </div>`;
                }).join("");
            } else {
                deviceHtml = `<div style="font-size:12px; color:#8b949e; margin-top:6px;">Waiting for login...</div>`;
            }

            let whitelistHtml = "";
            if(data.allowedHwids.length > 0) {
                whitelistHtml = `
                    <div class="key-details" style="margin-top:8px;"><b>HWID Whitelist:</b></div>
                    <div class="chips">
                        ${data.allowedHwids.map(h => `<span class="chip">${escapeHtml(h)}</span>`).join("")}
                    </div>`;
            }

            container.innerHTML += `
                <div class="key-item" style="border-left-color: ${data.revoked ? '#888' : (bound > 0 ? '#2dd4a7' : '#ff4d4d')}">
                    <div class="key-header"><span class="key-title">${k}</span>${statusHtml}</div>
                    <div class="key-details">
                        <b>Devices:</b> ${bound} / ${maxDevices === 0 ? 'Unlimited' : maxDevices}
                        <br><b>Expires:</b> ${expiryText}
                    </div>
                    ${deviceHtml}
                    ${whitelistHtml}
                    <div style="margin-top:10px;">${revokeBtn}${bindBtn}</div>
                </div>`;
        });
    }

    /* ===== NEW: HANDLE UNBIND BUTTONS ===== */
    document.getElementById('keysContainer').addEventListener('click', function (e) {
        const btn = e.target.closest('[data-unbind-key]');
        if(!btn) return;
        unbindHwid(btn.getAttribute('data-unbind-key'), btn.getAttribute('data-unbind-hwid'));
    });

    function logout() { location.reload(); }
</script>
</body>
</html>
