<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gucci Admin Panel</title>
    <style>
        body { background-color: #07090C; color: #FFFFFF; font-family: sans-serif; padding: 20px; }
        .card { background: #12161F; border: 1px solid #1F2633; padding: 20px; border-radius: 16px; max-width: 600px; margin: auto; }
        h1 { color: #00E5A0; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #0B0F17; border: 1px solid #1F2633; color: white; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 8px; background: #00E5A0; color: black; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background: #00c78a; }
        .key-item { display: flex; justify-content: space-between; align-items: center; background: #0B0F17; padding: 12px; margin-top: 8px; border-radius: 8px; border-left: 4px solid #00E5A0; }
        .btn-del { background: #FF4D4D; color: white; width: auto; padding: 6px 12px; margin: 0; }
        .status { text-align: center; margin-top: 10px; font-size: 14px; color: #8B949E; }
    </style>
</head>
<body>
    <div class="card">
        <h1>GUCCI ADMIN</h1>
        <input type="text" id="ghUser" placeholder="GitHub Username (e.g., guccipanelfree)">
        <input type="text" id="ghRepo" placeholder="Repo Name (e.g., Guccicorenew)">
        <input type="password" id="ghToken" placeholder="GitHub Personal Access Token">
        <button onclick="loadKeys()">Load Keys</button>
        
        <hr style="border-color: #1F2633; margin: 20px 0;">
        
        <input type="text" id="newKey" placeholder="Add new key (e.g., ADMIN-123)">
        <button onclick="addKey()">Add Key</button>
        
        <div id="keyList" style="margin-top: 20px;"></div>
        <div id="status" class="status"></div>
    </div>

    <script>
        let currentSha = "";
        const apiUrl = () => `https://api.github.com/repos/${document.getElementById('ghUser').value}/${document.getElementById('ghRepo').value}/contents/keys.txt`;
        const headers = () => ({
            "Authorization": `token ${document.getElementById('ghToken').value}`,
            "Accept": "application/vnd.github.v3+json",
            "Content-Type": "application/json"
        });

        async function loadKeys() {
            document.getElementById('status').innerText = "Loading...";
            try {
                const res = await fetch(apiUrl(), { headers: headers() });
                const data = await res.json();
                currentSha = data.sha;
                const content = atob(data.content);
                renderKeys(content.split('\n').filter(k => k.trim() !== ""));
                document.getElementById('status').innerText = "Keys Loaded successfully!";
            } catch (e) {
                document.getElementById('status').innerText = "Error: Check your Token or Repo name.";
            }
        }

        function renderKeys(keys) {
            const list = document.getElementById('keyList');
            list.innerHTML = "";
            keys.forEach(k => {
                list.innerHTML += `<div class="key-item"><span>${k}</span><button class="btn-del" onclick="delKey('${k}')">Delete</button></div>`;
            });
        }

        async function addKey() {
            const newKey = document.getElementById('newKey').value.trim();
            if (!newKey) return;
            await loadKeys();
            const keys = Array.from(document.querySelectorAll('.key-item span')).map(el => el.innerText);
            keys.push(newKey);
            saveKeys(keys);
        }

        async function delKey(key) {
            const keys = Array.from(document.querySelectorAll('.key-item span')).map(el => el.innerText).filter(k => k !== key);
            saveKeys(keys);
        }

        async function saveKeys(keys) {
            document.getElementById('status').innerText = "Saving...";
            const content = btoa(keys.join('\n'));
            const body = { message: "Update keys", content: content, sha: currentSha };
            try {
                await fetch(apiUrl(), { method: "PUT", headers: headers(), body: JSON.stringify(body) });
                loadKeys();
            } catch (e) {
                document.getElementById('status').innerText = "Failed to save.";
            }
        }
    </script>
</body>
</html>
